<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A0810">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Athanor">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>The Log</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  html, body {
    margin: 0; padding: 0;
    background: #0A0810;
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overflow-x: hidden;
  }
  input, textarea {
    -webkit-user-select: text;
    user-select: text;
    font-size: 16px !important;
  }
  button {
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s cubic-bezier(.34,1.56,.64,1), opacity .12s ease;
  }
  button:active {
    transform: scale(0.94);
    opacity: 0.82;
  }
  ::-webkit-scrollbar { display: none; }
  #root { min-height: 100vh; min-height: 100dvh; }

  :focus-visible {
    outline: 2px solid #A78BFA;
    outline-offset: 2px;
    border-radius: 4px;
  }
  :focus:not(:focus-visible) { outline: none; }

  #splash {
    position: fixed; inset: 0; z-index: 999;
    background: #0A0810;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .35s ease;
  }
  #splash svg { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: .55; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.06); }
  }
  #splash.hide { opacity: 0; pointer-events: none; }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .day-fade { animation: fadeSlideIn .28s ease both; }

  @keyframes ringPop {
    0%   { opacity: .9; transform: scale(0.85); }
    60%  { opacity: .35; transform: scale(1.35); }
    100% { opacity: 0; transform: scale(1.65); }
  }
  @keyframes barGlow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }
  @keyframes bannerIn {
    from { opacity: 0; transform: scale(.85) translateY(-4px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(10px) scale(.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
</style>
</head>
<body>

<div id="splash">
  <svg width="72" height="72" viewBox="0 0 26 26" fill="none">
    <circle cx="13" cy="13" r="10.5" fill="none" stroke="#A78BFA" stroke-width="1.4"/>
    <polygon points="13,7.5 17,15.5 9,15.5" fill="#A78BFA"/>
  </svg>
</div>

<div id="root"></div>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
